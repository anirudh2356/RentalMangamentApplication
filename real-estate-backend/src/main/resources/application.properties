spring.application.name=real-estate-backend
spring.datasource.url=jdbc:mysql://localhost:3306/realestate_messaging
spring.datasource.username=root
spring.datasource.password=tiger
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081
app.chatbot.openai.api-key=${OPENAI_API_KEY:}
app.current-user-id=1
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Demo account credentials are available only with the dev profile.
app.documents.storage-path=${DOCUMENT_STORAGE_PATH:uploads/documents}
app.documents.max-file-size=${DOCUMENT_MAX_FILE_SIZE:10485760}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB